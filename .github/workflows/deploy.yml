name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * *'   # Nightly: refresh concerts from the sheet
  workflow_dispatch:       # "Run workflow" button for an instant refresh

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          CONCERTS_CSV_URLS: ${{ secrets.CONCERTS_CSV_URLS }}
      # Pages is set to serve the gh-pages branch; public/CNAME keeps the domain
      - name: Deploy to the gh-pages branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: gh-pages
          build_dir: dist
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
